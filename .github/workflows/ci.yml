name: CI
on:
  pull_request:
    branches:
      - production

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Ref: ${{github.ref}}"
          echo "Ref name: ${{github.ref_name}}"
          echo "Commit: ${{github.sha}}"
          echo "env: ${{github.env}}"
          echo "Head ref: ${{github.head_ref}}"
          echo "Base ref: ${{github.base_ref}}"
