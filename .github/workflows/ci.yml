name: CI
on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      - name: Check linting
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build code
        run: npm build
