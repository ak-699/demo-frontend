name: CI
on:
  pull_request:
    branches:
      - main

jobs:
  format:
    uses: ./.github/workflows/prettier.yml
  lint:
    uses: ./.github/workflows/lint.yml
  build:
    needs: [format, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
